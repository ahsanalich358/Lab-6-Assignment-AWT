services:
  - type: web
    name: csc337-saas-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_MAX
        value: "20"
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: KAFKA_CLIENT_ID
        value: "csc337-saas-order-service"
      - key: KAFKA_GROUP_ID
        value: "order-processing-group"
      - key: KAFKA_TOPIC_ORDERS
        value: "tenant.orders"
